<style>
  :root{ color-scheme: light dark; }
  html,body{ height:100%; }
  body{ margin:0; background:#f9f9f7; color:#0b0b0b;
        font-family:"IBM Plex Sans",system-ui,-apple-system,sans-serif; }
  @media (prefers-color-scheme: dark){ body{ background:#0d0d0d; color:#fff; } }
  #gate{ min-height:100dvh; display:grid; place-items:center; padding:24px; }
  .box{ width:100%; max-width:380px; background:#fff; border:1.5px solid rgba(11,11,11,.14);
        border-radius:16px; padding:28px 26px 24px; box-shadow:0 1px 3px rgba(11,11,11,.06); }
  @media (prefers-color-scheme: dark){ .box{ background:#212120; border-color:rgba(255,255,255,.16); } }
  .lock{ font-size:26px; line-height:1; margin-bottom:14px; }
  h1{ font-family:"Manrope",system-ui,sans-serif; font-size:19px; font-weight:800;
      letter-spacing:-.01em; margin:0 0 6px; }
  p.hint{ font-size:13px; color:#6b6a66; margin:0 0 18px; line-height:1.5; }
  @media (prefers-color-scheme: dark){ p.hint{ color:#a3a29c; } }
  label{ display:block; font-size:12.5px; font-weight:500; margin-bottom:6px; }
  input{ width:100%; padding:11px 13px; font-size:15px; font-family:inherit;
         border:1px solid rgba(11,11,11,.2); border-radius:9px; background:transparent;
         color:inherit; box-sizing:border-box; }
  @media (prefers-color-scheme: dark){ input{ border-color:rgba(255,255,255,.22); } }
  input:focus{ outline:2px solid #2a78d6; outline-offset:1px; border-color:transparent; }
  button{ width:100%; margin-top:12px; padding:11px 16px; font-size:14.5px; font-weight:600;
          font-family:inherit; color:#fff; background:#184f95; border:0; border-radius:9px; cursor:pointer; }
  button:hover{ background:#123d75; }
  button:disabled{ opacity:.6; cursor:default; }
  .err{ margin-top:12px; font-size:13px; color:#d03b3b; min-height:18px; }
</style>
</head>
<body>
<div id="gate">
  <form class="box" id="f">
    <div class="lock">&#128274;</div>
    <h1>Bu pano korumalıdır</h1>
    <p class="hint">İçeriği görüntülemek için parolayı girin. Veriler sayfa içinde şifrelenmiş olarak tutulur ve yalnızca tarayıcınızda çözülür.</p>
    <label for="p">Parola</label>
    <input id="p" type="password" autocomplete="current-password" autofocus>
    <button id="b" type="submit">Panoyu aç</button>
    <div class="err" id="e"></div>
  </form>
</div>

<script>
(function(){
  const ITER = 250000;
  const b64 = document.getElementById('payload').textContent.trim();
  const f = document.getElementById('f'), inp = document.getElementById('p'),
        btn = document.getElementById('b'), err = document.getElementById('e');

  function bytes(s){ const bin = atob(s); const u = new Uint8Array(bin.length);
    for (let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return u; }

  async function open_(pw){
    const raw = bytes(b64);
    const salt = raw.slice(0,16), iv = raw.slice(16,28), ct = raw.slice(28);
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw),
                   'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      { name:'PBKDF2', salt, iterations:ITER, hash:'SHA-256' }, base,
      { name:'AES-GCM', length:256 }, false, ['decrypt']);
    const out = await crypto.subtle.decrypt({ name:'AES-GCM', iv }, key, ct);
    const ds = new DecompressionStream('gzip');
    const stream = new Blob([out]).stream().pipeThrough(ds);
    return await new Response(stream).text();
  }

  function render(html){
    document.body.innerHTML = html;
    document.body.querySelectorAll('script').forEach(old => {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      old.replaceWith(s);
    });
    try { sessionStorage.setItem('ttp', '1'); } catch(_){}
  }

  f.addEventListener('submit', async (ev) => {
    ev.preventDefault();
    err.textContent = ''; btn.disabled = true; btn.textContent = 'Açılıyor…';
    try {
      render(await open_(inp.value));
    } catch(_) {
      err.textContent = 'Parola hatalı.';
      btn.disabled = false; btn.textContent = 'Panoyu aç';
      inp.select();
    }
  });
})();
</script>
